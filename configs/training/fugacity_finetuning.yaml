{
  "extends": "supervised.yaml",
  "name": "c1_fugacity_finetuning",
  "training": {
    "epochs_physics": 10,
    "minimum_physics_epochs": 10
  },
  "physics_finetuning": {
    "enabled": true,
    "warmup_epochs": 2,
    "trainable_modules": [
      "pair_potential",
      "vapor_pressure",
      "film",
      "mixture_token"
    ],
    "pair_potential_lr": 0.00002,
    "vapor_pressure_lr": 0.00001,
    "film_lr": 0.000005,
    "mixture_token_lr": 0.000005,
    "teacher_forced_fugacity_weight": 1.0
  },
  "runtime": {
    "output_dir": "runs/public/c1_fugacity_finetuning",
    "results_file": "runs/public/c1_fugacity_finetuning/results.md"
  }
}
