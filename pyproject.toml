[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thermoformer"
version = "0.1.0"
description = "Molecular thermodynamics models and reproducible VLE/LLE experiments"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Jinlin Ye" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["experiments", "models", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true
exclude = "^(experiments|models|results|ThermoAgent)/"
